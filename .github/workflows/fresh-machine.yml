name: fresh machine
on:
  push:
    branches: [main, fresh-machine, 'demo/**']
  pull_request:
  workflow_dispatch:
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          nproc; free -h; df -h /; docker version --format 'docker {{.Server.Version}}'; docker compose version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: shops up
        run: time npm run shop
      - name: original and clean cart and checkout
        run: |
          npm run test:shop -- defect
          npm run test:shop -- clean
      - name: fix build gate
        run: |
          git -C shops/otel-demo/src apply "$GITHUB_WORKSPACE/evidence/2026-10-270453-before/fix.diff"
          time shops/otel-demo/stack.sh fix
          npm run test:shop -- fix
      - name: back to the release
        run: |
          shops/otel-demo/stack.sh unfix
          npm run test:shop -- defect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-browser-checks
          path: runs/smoke/
      - if: always()
        run: |
          shops/otel-demo/stack.sh down
          docker ps -a --format '{{.Names}}\t{{.Status}}' | sort
          free -h; df -h /
